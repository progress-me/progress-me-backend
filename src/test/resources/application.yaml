spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  flyway:
    enabled: false
  ai:
    google:
      genai:
        api-key: test-key
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 0.7
            max-output-tokens: 8192

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktbXVzdC1iZS1sb25nLWVub3VnaA==
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000
  ai:
    max-context-entries: 20
    models:
      orchestrator: gemini-3.5-flash-lite
      reasoning: gemini-4-argon
      execution: gemini-3.5-flash-lite
