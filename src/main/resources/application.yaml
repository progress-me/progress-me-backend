spring:
  application:
    name: progress-me-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/progress_analyzer
    username: app
    password: dev
#  close connection to db to save costs when is not used
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 600000
  data:
    redis:
      host: localhost
      port: 6379
      password: dev
      timeout: 2000ms
      connect-timeout: 1000ms
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: ${GOOGLE_API_MODEL:gemini-2.5-flash-lite}
            temperature: 0.7
            max-output-tokens: 8192

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
#  close connection to db to save costs when is not used
  health:
    db:
      enabled: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LXBsZWFzZS1jaGFuZ2UtaW4tcHJvZA==}
    expiration-ms: 900000
    refresh-expiration-ms: 2592000000
  ai:
    max-context-entries: 20
    models:
      orchestrator: ${GOOGLE_API_MODEL:gemini-2.5-flash-lite}
      reasoning: ${GOOGLE_API_REASONING_MODEL:gemini-2.5-pro}
      execution: ${GOOGLE_API_MODEL:gemini-2.5-flash-lite}
